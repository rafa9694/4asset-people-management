<div class="container vh-100 d-flex align-items-center justify-content-center">

  <div class="card shadow p-4" style="width: 400px;">

    <h2 class="text-center mb-4">
      {{ 'AUTH.TITLE' | translate }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="mb-3">
        <label>{{ 'AUTH.EMAIL' | translate }}</label>

        <input type="email" class="form-control" formControlName="email">
      </div>

      <div class="mb-3">
        <label>{{ 'AUTH.PASSWORD' | translate }}</label>

        <input type="password" class="form-control" formControlName="password">
      </div>

      <button type="submit" class="btn btn-primary-custom w-100" [disabled]="loading">
        {{ 'AUTH.LOGIN_BUTTON' | translate }}
      </button>

      <p class="text-center text-secondary-custom">
        {{ 'AUTH.FIRST_ACCESS' | translate }}
      
        <a class="link-default" routerLink="/register">
          {{ 'AUTH.CREATE_ACCOUNT' | translate }}
        </a>
      </p>

    </form>

  </div>

</div>
