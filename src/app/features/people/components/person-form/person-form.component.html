<form [formGroup]="form" (ngSubmit)="submit()">

  <div class="mb-3">

    <label class="form-label">
      {{ 'PEOPLE.NAME' | translate }}
    </label>

    <input type="text" class="form-control" formControlName="name">

  </div>

  <div class="mb-3">

    <label class="form-label">
      {{ 'PEOPLE.EMAIL' | translate }}
    </label>

    <input type="email" class="form-control" formControlName="email">

  </div>

  <div class="mb-3">

    <label class="form-label">
      {{ 'PEOPLE.PHONE' | translate }}
    </label>

    <input type="text" class="form-control" formControlName="phone" mask="(00) 00000-0000">

  </div>

  <div class="mb-4">

    <label class="form-label">
      {{ 'PEOPLE.BIRTH_DATE' | translate }}
    </label>

    <input type="date" class="form-control" formControlName="birthDate">

  </div>

  <button type="submit" class="btn btn-primary-custom" [disabled]="loading">

    @if (loading) {
    
      <span class="spinner-border spinner-border-sm me-2"></span>
    
    }

    {{ 'COMMON.SAVE' | translate }}

  </button>

</form>
